# Local testing stack: Postgres + backend API.
#   docker compose up --build
# The DB is exposed on host port 5433 to avoid clashing with other local Postgres.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: swipe
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swipe"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 'db' is the compose service hostname; port 5432 inside the network.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/swipe
      CORS_ORIGINS: http://localhost:3000
      ADMIN_EMAILS: admin@example.com
    ports:
      - "8000:8000"
    # Apply migrations, then start the API.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
